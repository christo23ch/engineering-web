name: Lint

# Blocking quality gate: ESLint + Prettier + TypeScript (docs/PROJECT_BIBLE.md §30).
# See build.yml: the trunk is `claude/repo-structure-setup-9eg3lj`, not `main`.
on:
  push:
    branches: [main, claude/repo-structure-setup-9eg3lj]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier (check)
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
