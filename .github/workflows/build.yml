name: Build & Test

# Blocking gates: build + unit/integration tests + accessibility (axe) + SCA.
# docs/PROJECT_BIBLE.md §32 (testing), §33 (deploy), §17/§30 (SCA).
# The repository's default branch is `claude/repo-structure-setup-9eg3lj`; there
# is no `main`. Listing only `main` meant pushes to the trunk ran NO checks at
# all — `main` is kept for the day the trunk is renamed.
on:
  push:
    branches: [main, claude/repo-structure-setup-9eg3lj]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build (Astro SSG)
        run: npm run build
      - name: Unit + integration tests
        run: npm test
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Full Playwright suite, not just the axe spec: the form round-trip, the
  # security headers/CSP, the API smoke and the SEO specs are blocking gates
  # too, and running only tests/e2e/a11y.spec.ts left 10 of 11 specs unchecked.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Reuse the build from build-and-test instead of rebuilding.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Cache the Playwright browser between runs (keyed on the lockfile).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E + accessibility (Playwright + axe, WCAG 2.2 AA)
        run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Blocking gate: fail on CRITICAL advisories (Bible §30).
      - name: SCA — block on critical
        run: npm audit --audit-level=critical
      # Non-blocking visibility for high/moderate (e.g. build-tool advisories).
      - name: SCA — report high (non-blocking)
        run: npm audit --audit-level=high || true
