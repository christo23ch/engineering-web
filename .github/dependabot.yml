version: 2
# Dependency freshness policy (audit committee P2-2). Keeps the stack current
# over the project's multi-year horizon. Majors are reviewed manually.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk updates to reduce PR noise.
      dev-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
      prod-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
